<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17493d">
<title>Cimaise</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>/* Cimaise : les murs d'un musée que l'on parcourt, chaque époque est une salle peinte. Une colonne de temps verticale, cartels clairs sur murs profonds. */
:root{
  --wall:#17493d; --cartel:#f0ede5; --cartel-2:#e2ddd0; --ink:#20231f; --ink-2:#5b5f57;
  --brass:#d0ac63; --ivory:#f5f2ea; --sapin:#17493d;
  --display:"Bodoni Moda","Didot","Bodoni MT","Bodoni 72","GFS Didot","Noto Serif Display",Georgia,serif;
  --body:"Libre Franklin","Helvetica Neue",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#17493d;color:var(--ivory);font:15px/1.5 var(--body);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,p{margin:0;text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
#app{height:100%;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}

/* En-tête : l'époque et l'année sous la ligne de lecture */
#top{background:var(--wall);transition:background .35s;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;display:flex;align-items:flex-end;gap:12px;min-height:84px}
#era-btn{flex:1;min-width:0;text-align:left;font-family:var(--display);font-size:20px;line-height:1.12;font-weight:500}
#year{font-family:var(--display);font-size:46px;line-height:.95;font-weight:500;font-variant-numeric:lining-nums;white-space:nowrap;letter-spacing:-.01em}
#year small{font-size:15px;font-family:var(--body);margin-left:4px;letter-spacing:0}
#menu{width:44px;height:44px;margin:-4px -10px 0 -4px;align-self:flex-start;display:grid;place-items:center}
#menu svg{width:22px;height:22px;stroke:var(--ivory);fill:none;stroke-width:1.6}
#top.plain #year{display:none}
#top.plain #era-btn{font-size:28px}

main{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex;flex-direction:column}

/* Frise */
#cols{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,.28);font-size:12.5px}
#cols .seg{display:flex;gap:2px;flex:1}
#cols .seg button{padding:6px 11px;border-radius:2px;min-height:32px;color:rgba(245,242,234,.78)}
#cols .seg button[aria-pressed=true]{background:var(--ivory);color:var(--ink);font-weight:600}
#cols .zoom{display:flex;gap:4px}
#cols .zoom button{min-width:36px;height:32px;padding:0 6px;border:1px solid rgba(245,242,234,.4);border-radius:2px;font-size:16px;line-height:1}
#cols .zoom button.txt{font-size:12.5px}
#tl{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#111}
.room{position:absolute;left:0;right:0;top:0}
.room-name{position:absolute;left:3px;top:0;writing-mode:vertical-rl;font-family:var(--display);font-size:13.5px;line-height:1;white-space:nowrap;color:rgba(245,242,234,.72)}
.tick{position:absolute;left:18px;width:40px;top:0;font-size:11px;line-height:1;font-variant-numeric:tabular-nums;color:rgba(245,242,234,.74);border-top:1px solid rgba(245,242,234,.4);padding-top:2px}
.bar{position:absolute;top:0;overflow:hidden;background:rgba(245,242,234,.13);color:var(--ivory);border-left:2px solid var(--ivory);text-align:left;font-size:12px;line-height:1.14;font-weight:500;padding:0}
.bar.m{background:rgba(208,172,99,.16);border-left-color:var(--brass);color:#f0dcae}
.bar.on{background:var(--cartel);color:var(--ink)}
.bar.m.on{background:var(--brass);color:var(--ink)}
.bar span{display:block;padding:3px 4px;white-space:nowrap}
.bar[data-l=""] span{visibility:hidden}
.bar[data-l=h] span{white-space:normal}
.bar[data-l=v] span{writing-mode:vertical-rl;padding:4px 1px;font-size:11.5px;white-space:normal;height:100%}
.wk{position:absolute;top:0;right:5px;width:44px;height:44px;border:2px solid var(--brass);background:var(--cartel);overflow:hidden;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.wk img{width:100%;height:100%;object-fit:cover;display:block}
.wk.approx{border-style:dashed}
.wk b{position:absolute;right:0;bottom:0;background:var(--brass);color:var(--ink);font-size:11px;line-height:1;padding:2px 4px;font-weight:700}
.wk i{font:600 9.5px/1.1 var(--body);display:block;padding:3px;overflow:hidden;height:100%}
#line{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--brass);pointer-events:none;box-shadow:0 0 0 .5px rgba(0,0,0,.5)}
#chips{background:rgba(0,0,0,.28);min-height:50px;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:7px 12px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;min-height:34px;border-radius:2px;background:var(--cartel);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
.chip.m{background:var(--brass)}
#nav{display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;background:#10362d;padding:4px 4px calc(env(safe-area-inset-bottom) + 4px)}
#nav button.t{min-height:52px;font-size:13px;color:rgba(245,242,234,.75);border-top:2px solid transparent}
#nav button.t[aria-current=page]{color:var(--ivory);font-weight:600;border-top-color:var(--brass)}
#add{width:54px;height:54px;border-radius:50%;background:var(--brass);color:var(--ink);font-size:32px;line-height:1;font-family:var(--display);justify-self:center;margin-top:-8px;box-shadow:0 3px 10px rgba(0,0,0,.4)}

/* Vues liste */
.pad{padding:14px 16px 24px;overflow-y:auto;flex:1;min-height:0}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.filters button{flex:none;padding:7px 12px;min-height:36px;border:1px solid rgba(245,242,234,.45);border-radius:2px;font-size:13px}
.filters button[aria-pressed=true]{background:var(--ivory);color:var(--ink);border-color:var(--ivory);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{aspect-ratio:1;background:var(--cartel);color:var(--ink);overflow:hidden;position:relative;border:2px solid transparent;text-align:left;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile p{padding:7px;font-size:12px;line-height:1.25}
.tile em{position:absolute;left:0;bottom:0;background:var(--brass);color:var(--ink);font-style:normal;font-size:10.5px;font-weight:600;padding:2px 5px}
.empty{padding:20px 0;max-width:34em}
.empty h2{font-family:var(--display);font-size:25px;font-weight:500;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 16px;background:var(--sapin);color:var(--ivory);border-radius:2px;font-weight:600;font-size:14px;text-decoration:none;text-align:center}
.btn.alt{background:none;box-shadow:inset 0 0 0 1px currentColor;color:var(--sapin)}
.btn.brass{background:var(--brass);color:var(--ink)}
.btn.danger{background:none;color:#8c2a22;box-shadow:inset 0 0 0 1px #8c2a22}
.btn.danger.arm{background:#8c2a22;color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--cartel);color:var(--ink);padding:12px 14px;text-align:left;display:block;width:100%;border-radius:1px}
.card h3{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2}
.card p{font-size:13.5px;color:var(--ink-2)}
.card .quote{color:var(--ink);margin-top:4px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.head-row h2,.sec-t{font-family:var(--display);font-size:22px;font-weight:500}
.sec-t{margin:18px 0 8px}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar input{flex:1;min-width:0;min-height:46px;padding:9px 12px;background:var(--cartel);color:var(--ink);border:0;border-radius:2px;font-size:16px}
.note{font-size:13.5px;color:rgba(245,242,234,.8)}

/* Fiches : cartels clairs */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9}
#veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:93%;max-height:93dvh;background:var(--cartel);color:var(--ink);z-index:10;display:flex;flex-direction:column;border-top:3px solid var(--brass);max-width:640px;margin:0 auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 8px}
.sheet-h h2{flex:1;font-family:var(--display);font-size:29px;line-height:1.08;font-weight:500}
.sheet-x{width:44px;height:44px;margin:-8px -10px 0 0;font-size:28px;line-height:1;color:var(--ink);flex:none}
.sheet-b{overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 20px);flex:1;min-height:0}
.sheet-f{display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--cartel-2)}
.sheet-f .btn{flex:1}
.dates{color:var(--ink-2);font-size:14px;margin-bottom:10px}
.sheet-b p.lead{font-size:16px;line-height:1.5;margin-bottom:6px;max-width:62ch}
.sheet-b h3{font-family:var(--display);font-size:20px;font-weight:600;margin:18px 0 6px}
.keys{margin:0;padding:0 0 0 18px}
.keys li{margin:4px 0}
.keys li::marker{color:#9a7a36}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:6px 10px;min-height:34px;background:var(--cartel-2);border-radius:2px;font-size:13.5px;color:var(--ink);text-align:left}
.tag.sug{background:var(--brass);font-weight:600}
.tag[aria-pressed=true]{background:var(--sapin);color:var(--ivory);font-weight:600}
.oeuvre{display:block;text-align:left;width:100%;padding:8px 0;border-bottom:1px solid var(--cartel-2)}
.oeuvre b{font-family:var(--display);font-size:17px;font-weight:600;display:block;line-height:1.2}
.oeuvre span{font-size:13.5px;color:var(--ink-2)}
.wiki{background:#e6e2d6;padding:12px;margin-top:18px}
.wiki p{font-size:14.5px;margin-bottom:8px}
.wiki .row{display:flex;gap:8px;flex-wrap:wrap}
.wiki img{float:right;width:84px;margin:0 0 6px 10px}
.small{font-size:13px;color:var(--ink-2)}

/* Formulaire */
.form{display:flex;flex-direction:column;gap:11px}
.prev{width:100%;max-height:200px;object-fit:contain;background:#ddd8ca;display:block}
.f label,.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:9px 10px;background:#fff;border:1px solid #b9b3a3;border-radius:2px;color:var(--ink);font-size:16px}
.f textarea{min-height:92px;resize:vertical;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2{display:flex;border:1px solid var(--sapin);border-radius:2px;overflow:hidden}
.seg2 button{flex:1;min-height:42px;font-size:13.5px;color:var(--sapin)}
.seg2 button[aria-pressed=true]{background:var(--sapin);color:var(--ivory);font-weight:600}
.stars{display:flex;gap:2px}
.stars button{width:42px;height:42px;font-size:27px;line-height:1;color:#a9a392}
.stars button.on{color:#9a7a36}
.hint{font-size:13px;color:var(--ink-2);margin-bottom:6px}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--ivory);padding:11px 14px;font-size:14px;z-index:30;text-align:center;display:none;border-radius:2px}
#toast.on{display:block}
.full{width:100%;display:block;max-height:58vh;object-fit:contain;background:#ddd8ca;margin-bottom:10px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14.5px;margin:6px 0}
.meta dt{color:var(--ink-2)}.meta dd{margin:0}
@media (min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="era-btn"></button>
    <div id="year" aria-live="off"></div>
    <button id="menu" aria-label="Mes données et sauvegarde"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main>
    <section class="view" id="v-frise">
      <div id="cols">
        <div class="seg" role="group" aria-label="Colonnes affichées">
          <button data-t="both">Tout</button><button data-t="w">Occident</button><button data-t="m">Monde</button>
        </div>
        <div class="zoom">
          <button id="z-out" aria-label="Dézoomer">−</button><button id="z-in" aria-label="Zoomer">+</button><button id="z-all" class="txt">Vue entière</button>
        </div>
      </div>
      <div id="tl"></div>
      <div id="chips" aria-label="Courants à cette date"></div>
    </section>
    <section class="view" id="v-oeuvres"></section>
    <section class="view" id="v-carnet"></section>
    <section class="view" id="v-recherche"></section>
  </main>
  <nav id="nav" aria-label="Navigation">
    <button class="t" data-v="frise">Frise</button>
    <button class="t" data-v="oeuvres">Œuvres</button>
    <button id="add" aria-label="Ajouter une œuvre">+</button>
    <button class="t" data-v="carnet">Carnet</button>
    <button class="t" data-v="recherche">Recherche</button>
  </nav>
</div>
<div id="veil"></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<div id="toast" role="status"></div>
<script>/* Base de connaissances embarquée : disponible hors ligne, sans aucun appel réseau. */
const M = (id, tr, n, s, e, wiki, t, k, a, o) => ({ id, tr, n, s, e, wiki, t, k, a, o });

const ERAS = [
  { ...M("e-prehistoire", "era", "Préhistoire", -40000, -3300, "Art préhistorique",
    "Les premières images connues naissent bien avant l’écriture : parois de grottes, statuettes, puis monuments de pierre.",
    ["Support principal : la paroi des grottes et l’objet portable", "Animaux dominants, figure humaine rare et stylisée", "Fonction encore débattue : rituelle, symbolique, narrative"],
    ["Artistes anonymes des grottes ornées"],
    [["Panneau des chevaux, grotte Chauvet", "Anonyme", "vers 36 000 av. J.-C.", "Ardèche"], ["Salle des Taureaux, Lascaux", "Anonyme", "vers 17 000 av. J.-C.", "Dordogne"], ["Vénus de Willendorf", "Anonyme", "vers 29 500 av. J.-C.", "Naturhistorisches Museum, Vienne"]]), wall: "#3f2c1f" },
  { ...M("e-antiquite", "era", "Antiquité", -3300, 476, "Art antique",
    "De l’invention de l’écriture à la chute de Rome à l’Ouest : Égypte, Mésopotamie, Grèce et Rome fixent des canons qui nourriront tout l’art occidental.",
    ["L’art sert le pouvoir, les dieux et les morts", "La Grèce invente l’idéal de proportion du corps", "Rome diffuse ce modèle dans tout l’Empire et développe le portrait"],
    ["Phidias", "Praxitèle", "Polyclète", "Myron", "Lysippe"],
    [["Scribe accroupi", "Anonyme", "vers 2500 av. J.-C.", "Musée du Louvre"], ["Vénus de Milo", "Anonyme", "vers 130-100 av. J.-C.", "Musée du Louvre"], ["Colonne Trajane", "Anonyme", "113", "Rome"]]), wall: "#5c2a20" },
  { ...M("e-moyen-age", "era", "Moyen Âge", 476, 1400, "Art médiéval",
    "Un millénaire où l’image est d’abord religieuse : enluminures, mosaïques, abbatiales romanes puis cathédrales gothiques.",
    ["L’Église est le premier commanditaire", "L’œuvre enseigne : on parle de « Bible des illettrés »", "L’artiste reste souvent anonyme, l’atelier prime"],
    ["Gislebertus", "Nicolas de Verdun", "Cimabue", "Jean Pucelle"],
    [["Tapisserie de Bayeux", "Anonyme", "vers 1070", "Musée de la Tapisserie, Bayeux"], ["Tympan de Sainte-Foy de Conques", "Anonyme", "vers 1107-1125", "Conques"], ["Vitraux de la Sainte-Chapelle", "Anonyme", "vers 1248", "Paris"]]), wall: "#1b2e5c" },
  { ...M("e-renaissance", "era", "Renaissance", 1400, 1600, "Renaissance",
    "Partie d’Italie, la Renaissance redécouvre l’Antiquité, place l’homme au centre et donne à l’artiste un statut d’intellectuel.",
    ["Perspective linéaire et anatomie deviennent des savoirs", "Mécénat des princes et des banquiers, comme les Médicis", "Humanisme : sujets antiques aux côtés des sujets chrétiens"],
    ["Léonard de Vinci", "Michel-Ange", "Raphaël", "Titien", "Dürer", "Botticelli"],
    [["La Joconde", "Léonard de Vinci", "1503-1519", "Musée du Louvre"], ["L’École d’Athènes", "Raphaël", "1509-1511", "Musées du Vatican"], ["La Naissance de Vénus", "Botticelli", "vers 1485", "Galerie des Offices, Florence"]]), wall: "#17493d" },
  { ...M("e-classique", "era", "Âge baroque et classique", 1600, 1780, "Art baroque",
    "Deux siècles partagés entre l’élan baroque de la Contre-Réforme, la rigueur classique française et la légèreté rococo.",
    ["L’art persuade et émeut pour l’Église et les monarchies", "Fondation de l’Académie royale de peinture en 1648", "Essor d’un marché privé aux Pays-Bas : scènes de genre, natures mortes"],
    ["Caravage", "Rubens", "Rembrandt", "Velázquez", "Poussin", "Vermeer"],
    [["Les Ménines", "Velázquez", "1656", "Musée du Prado, Madrid"], ["La Ronde de nuit", "Rembrandt", "1642", "Rijksmuseum, Amsterdam"], ["Et in Arcadia ego", "Nicolas Poussin", "vers 1638", "Musée du Louvre"]]), wall: "#5f1c2c" },
  { ...M("e-xix", "era", "Long XIXe siècle", 1780, 1905, "Art du XIXe siècle",
    "Des révolutions à la Belle Époque, les artistes s’émancipent peu à peu du Salon, de l’Académie et des sujets nobles.",
    ["Querelles successives : néoclassiques, romantiques, réalistes", "Tube de peinture et peinture sur le motif", "Salon contesté et naissance du couple marchand-critique"],
    ["David", "Delacroix", "Courbet", "Manet", "Monet", "Cézanne"],
    [["La Liberté guidant le peuple", "Eugène Delacroix", "1830", "Musée du Louvre"], ["Un enterrement à Ornans", "Gustave Courbet", "1849-1850", "Musée d’Orsay"], ["La Nuit étoilée", "Vincent van Gogh", "1889", "MoMA, New York"]]), wall: "#2b4059" },
  { ...M("e-modernites", "era", "Avant-gardes et modernité", 1905, 1960, "Art moderne",
    "En quelques décennies, les avant-gardes rompent avec l’imitation du réel : couleur libre, formes éclatées, abstraction, hasard et inconscient.",
    ["Succession rapide de groupes et de manifestes", "Les deux guerres déplacent le centre de Paris à New York", "L’objet et l’idée peuvent devenir œuvre"],
    ["Picasso", "Matisse", "Kandinsky", "Duchamp", "Mondrian", "Pollock"],
    [["Les Demoiselles d’Avignon", "Pablo Picasso", "1907", "MoMA, New York"], ["Fontaine", "Marcel Duchamp", "1917", "Original perdu, répliques en musées"], ["Guernica", "Pablo Picasso", "1937", "Musée Reina Sofía, Madrid"]]), wall: "#42452c" },
  { ...M("e-contemporain", "era", "Art contemporain", 1960, 2030, "Art contemporain",
    "Depuis les années 1960, plus de style dominant : installation, performance, vidéo, numérique, dans un monde de l’art devenu global.",
    ["L’idée et le contexte comptent autant que l’objet", "Sortie de l’atelier : paysage, rue, corps, écran", "Marché, foires et biennales structurent la reconnaissance"],
    ["Andy Warhol", "Joseph Beuys", "Louise Bourgeois", "Gerhard Richter", "Jeff Koons", "Yayoi Kusama"],
    [["Campbell’s Soup Cans", "Andy Warhol", "1962", "MoMA, New York"], ["Maman", "Louise Bourgeois", "1999", "Plusieurs exemplaires dans le monde"], ["Sunflower Seeds", "Ai Weiwei", "2010", "Tate Modern, Londres"]]), wall: "#2c2d35" },
];

const MOVEMENTS = [
  /* Préhistoire et Antiquité */
  M("paleo", "w", "Art pariétal paléolithique", -36000, -10000, "Art pariétal",
    "Grottes peintes et gravées d’Europe, d’une maîtrise qui contredit l’idée d’un art primitif.",
    ["Utilisation du relief de la roche pour modeler les animaux", "Pigments : ocres et charbon", "Deux sites majeurs français : Chauvet et Lascaux"],

/* Comprend : 1889, vers 1650, 1885-1890, 500 av. J.-C., -500, XVIIe, 17e siècle, début XXe */
function parseYear(str) {

    const c = /^\d/.test(m[1]) ? +m[1] : roman(m[1]);
    if (c >= 1 && c <= 21) {
      let y = (c - 1) * 100 + 50;
      if (/debut/.test(s)) y -= 35; if (/\bfin\b/.test(s)) y += 35;
      return bc ? -y : y;
    }

  const nums = s.replace(/(\d)[\s.](\d{3})\b/g, "$1$2").match(/\d{1,5}/g);

  let a = +nums[0], b = nums[1] ? +nums[1] : null;

  let y = b !== null && b !== a && Math.abs(b - a) < 500 ? Math.round((a + b) / 2) : a;

  return clamp(y, -40000, 2030);
}

/* Propose les courants à partir de l'artiste (s'il est connu) et de l'année */
function suggest(year, artist) {
  const out = [], seen = new Set();
  const na = norm(artist);
  if (na.length > 2) for (const m of MOVEMENTS) {
    const hit = m.a.some(x => { const n = norm(x); return n === na || n.endsWith(" " + na) || n.split(" ").includes(na) && na.length > 3; });
    if (hit && (year == null || (year >= m.s - 40 && year <= m.e + 40))) { out.push(m); seen.add(m.id); }
  }
  if (year != null) {
    const list = MOVEMENTS.filter(m => year >= m.s && year <= m.e && !seen.has(m.id)).map(m => {
      const mid = (m.s + m.e) / 2, half = Math.max(1, (m.e - m.s) / 2);
      return [Math.abs(year - mid) / half + (MAJORS.has(m.id) ? 0 : .55) + (m.tr === "m" ? .9 : 0), m];
    }).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    out.push(...list);
  }
  return out.slice(0, 5);
}

/* Répartit des périodes qui se chevauchent : chaque barre prend la largeur que lui laisse sa période */
function pack(items) {
  const L = [...items].sort((a, b) => a.s - b.s || b.e - a.e);
  const over = (a, b) => a.s < b.e && b.s < a.e;
  for (const it of L) {
    let c = 1;
    for (const p of [it.s, ...L.filter(o => o.s > it.s && o.s < it.e).map(o => o.s)]) c = Math.max(c, L.filter(o => o.s <= p && p < o.e).length);
    it.c = c;
  }
  const placed = [];
  for (const it of L) {
    const ov = placed.filter(o => over(o, it)).sort((a, b) => a.x - b.x);
    const free = (x, w) => x + w <= 1.0001 && !ov.some(o => x < o.x + o.w - 1e-4 && o.x < x + w - 1e-4);
    let w = 1 / it.c, x = [0, ...ov.map(o => o.x + o.w)].find(c => free(c, w));
    if (x === undefined) {

      if (1 - cur > best) { best = 1 - cur; bx = cur; }
      x = bx; w = best;
    }
    it.x = x; it.w = w; placed.push(it);
  }
  return placed;
}

function zoomAt(py, nz) {
  nz = clamp(nz, minZ(), 16); const u = (TL.top + py) / TL.z;
  TL.z = nz; TL.top = u * nz - py; clampTop(); schedule();
}
function bindGestures() {
  const pts = new Map(); let pinch = null, lastY = 0, lastT = 0, vel = 0, startY = 0;
  const rel = e => e.clientY - tl.getBoundingClientRect().top;
  tl.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, e.clientY); cancelAnimationFrame(TL.inertia); TL.moved = false;
    try { tl.setPointerCapture(e.pointerId); } catch {}
    if (pts.size === 1) { lastY = startY = e.clientY; lastT = e.timeStamp; vel = 0; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.max(30, Math.abs(a - b)), z: TL.z }; TL.moved = true; }
  });
  tl.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e.clientY);
    if (pts.size >= 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.max(30, Math.abs(a - b)), rect = tl.getBoundingClientRect();
      zoomAt((a + b) / 2 - rect.top, pinch.z * d / pinch.d); return;
    }
    if (pts.size === 1) {
      if (Math.abs(e.clientY - startY) > 7) TL.moved = true;
      if (!TL.moved) return;
      const dy = e.clientY - lastY, dt = Math.max(1, e.timeStamp - lastT);
      vel = .75 * (dy / dt) + .25 * vel; lastY = e.clientY; lastT = e.timeStamp;
      TL.top -= dy; clampTop(); schedule();
    }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 1) { lastY = startY = [...pts.values()][0]; lastT = e.timeStamp; vel = 0; }
    if (pts.size === 0 && TL.moved && Math.abs(vel) > .08 && e.timeStamp - lastT < 80) glide(vel);
  };
  tl.addEventListener("pointerup", up); tl.addEventListener("pointercancel", up);
  tl.addEventListener("wheel", e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomAt(rel(e), TL.z * Math.exp(-e.deltaY * .01)); else { TL.top += e.deltaY; clampTop(); schedule(); } }, { passive: false });
  function glide(v) { let t = performance.now(); const step = n => { const dt = Math.min(40, n - t); t = n; TL.top -= v * dt; clampTop(); v *= Math.pow(.996, dt); schedule(); if (Math.abs(v) > .03) TL.inertia = requestAnimationFrame(step); }; TL.inertia = requestAnimationFrame(step); }
  tl.addEventListener("click", e => {
    if (TL.moved) { TL.moved = false; return; }
    const t = e.target.closest("[data-m],[data-w],[data-g]"); if (!t) return;
    if (t.dataset.m) openFiche(t.dataset.m); else if (t.dataset.w) openWork(t.dataset.w); else openGroup(t.dataset.g.split(","));
  });
}
function setTrack(t) { TL.track = t; lsSet("track", t); document.querySelectorAll("#cols .seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t)); layoutBars(); TL.lastYear = null; schedule(); }

/* ========= Fenêtres ========= */
const stack = [];
function openSheet(title, body, foot) {
  const s = document.createElement("section"); s.className = "sheet"; s.setAttribute("role", "dialog"); s.setAttribute("aria-modal", "true");
  s.innerHTML = `<div class="sheet-h"><h2></h2><button class="sheet-x" aria-label="Fermer">×</button></div><div class="sheet-b"></div>${foot ? '<div class="sheet-f"></div>' : ""}`;
  $("h2", s).textContent = title; $(".sheet-b", s).innerHTML = body; if (foot) $(".sheet-f", s).innerHTML = foot;
  $(".sheet-x", s).onclick = () => closeSheet();
  document.body.append(s); if (stack.length) stack[stack.length - 1].style.display = "none";
  stack.push(s); $("#veil").classList.add("on"); history.pushState({ sheet: stack.length }, "");
  return s;
}
function closeSheet() { if (stack.length) history.back(); }
function closeSheetNow(s) { if (s && s === stack[stack.length - 1]) closeSheet(); }
window.addEventListener("popstate", () => {
  const s = stack.pop(); if (!s) return; s.onclosed?.(); s.remove();
  if (stack.length) stack[stack.length - 1].style.display = ""; else $("#veil").classList.remove("on");
});
$("#veil").onclick = () => { if (!stack[stack.length - 1]?.dataset.sticky) closeSheet(); };

/* ========= Fiche d'un courant ou d'une époque ========= */
async function openFiche(id) {
  const m = byId[id], mine = works.filter(w => w.movement === id);
  const note = (await dbGet("notes", id))?.text || "", saved = await dbGet("wiki", m.wiki);
  const tagKind = m.tr === "era" ? "Époque" : m.tr === "m" ? "Repère mondial" : "Courant";
  const s = openSheet(m.n, `
    <p class="dates">${tagKind}, ${fmtSpan(m)}</p>
    <p class="lead">${esc(m.t)}</p>
    <h3>À retenir</h3><ul class="keys">${m.k.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Artistes phares</h3><div class="tags">${m.a.map(a => /anonym/i.test(a) ? `<span class="tag">${esc(a)}</span>` : `<button class="tag" data-q="${esc(a)}">${esc(a)}</button>`).join("")}</div>
    <h3>Œuvres célèbres</h3>${m.o.map(o => `<button class="oeuvre" data-q="${esc(o[0])}"><b>${esc(o[0])}</b><span>${esc(o[1])}, ${esc(o[2])}. ${esc(o[3])}</span></button>`).join("")}
    <div class="wiki"><div class="w-body">${saved ? wikiHtml(saved) : ""}</div><div class="row">${saved ? "" : `<button class="btn w-load">Charger la synthèse Wikipédia</button>`}<a class="btn alt" href="${wikiUrl(m.wiki)}" target="_blank" rel="noopener">Ouvrir sur Wikipédia</a></div></div>
    ${mine.length ? `<h3>Mes œuvres rattachées</h3><div class="grid">${mine.map(tile).join("")}</div>` : ""}
    <h3>Mes notes</h3><div class="f"><textarea id="m-note" aria-label="Mes notes sur ${esc(m.n)}" placeholder="Ce que je retiens, ce qui m’a marqué, à revoir…">${esc(note)}</textarea></div><p class="small" id="m-state"></p>`);
  bindCommon(s);
  const load = $(".w-load", s);
  if (load) load.onclick = async () => {
    load.textContent = "Chargement…"; load.disabled = true;
    try { const d = await fetchSummary(m.wiki); $(".w-body", s).innerHTML = wikiHtml(d); load.remove(); }
    catch { load.disabled = false; load.textContent = "Réessayer"; toast(navigator.onLine ? "Wikipédia n’a pas répondu. Réessaie dans un instant." : "Pas de réseau : la fiche ci-dessus reste disponible."); }
  };
  let t; const area = $("#m-note", s), st = $("#m-state", s);
  const save = () => dbPut("notes", { id, text: area.value, at: Date.now() }).then(() => st.textContent = "Notes enregistrées");
  area.oninput = () => { clearTimeout(t); st.textContent = ""; t = setTimeout(save, 500); };
  s.onclosed = () => { clearTimeout(t); if (area.value !== note) save(); };
}
function bindCommon(root) {
  root.addEventListener("click", e => {
    const q = e.target.closest("[data-q]"); if (q) { openWikiFor(q.dataset.q); return; }
    const w = e.target.closest("[data-w]"); if (w && !e.target.closest(".wk")) { openWork(w.dataset.w); return; }
    const m = e.target.closest("button[data-m]"); if (m) openFiche(m.dataset.m);
  });
}
const tile = w => `<button class="tile" data-w="${w.id}">${w.thumb ? `<img alt="${esc(w.title || "Œuvre")}" loading="lazy" src="${thumb(w)}">` : `<p><b>${esc(w.title || "Sans titre")}</b><br>${esc(w.artist || "")}</p>`}${incomplete(w) ? "<em>À compléter</em>" : ""}</button>`;
const incomplete = w => !w.artist || !w.title || !w.year;

/* ========= Wikipédia : gratuit, sans Claude, gardé pour le hors-ligne ========= */
async function fetchSummary(title) {
  const get = t => fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t.replace(/ /g, "_")));
  let r = await get(title);
  if (r.status === 404) { const hits = await wikiSearch(title); if (hits.length) r = await get(hits[0].title); }
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const d = { id: title, title: j.title, text: j.extract, desc: j.description || "", url: j.content_urls?.mobile?.page || wikiUrl(title), img: j.thumbnail?.source || "", at: Date.now() };
  await dbPut("wiki", d); return d;
}
const wikiHtml = d => `${d.img && navigator.onLine ? `<img alt="" src="${esc(d.img)}">` : ""}<p>${esc(d.text)}</p><p class="small">Source : Wikipédia. Synthèse gardée pour le hors-ligne.</p>`;
async function openWikiFor(q) {
  const cached = await dbGet("wiki", q);
  if (cached) return showWiki(cached);
  if (!navigator.onLine) return toast("Pas de réseau : cette page n’a pas encore été enregistrée.");
  try { const hits = await wikiSearch(q); if (!hits.length) return toast("Aucune page trouvée sur Wikipédia."); showWiki(await fetchSummary(hits[0].title)); }
  catch { toast("Wikipédia n’a pas répondu. Réessaie dans un instant."); }
}
function showWiki(d) { openSheet(d.title, `${d.desc ? `<p class="dates">${esc(d.desc)}</p>` : ""}<div class="wiki" style="margin-top:0">${wikiHtml(d)}<div class="row"><a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">Lire sur Wikipédia</a></div></div>`); }
async function wikiSearch(q) {
  const r = await fetch("https://fr.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=8&srsearch=" + encodeURIComponent(q));
  if (!r.ok) throw new Error("HTTP " + r.status);
  return (await r.json()).query.search.map(x => ({ title: x.title, snip: x.snippet.replace(/<[^>]+>/g, "").replace(/&quot;/g, '"').replace(/&amp;/g, "&").replace(/&#0?39;/g, "’") }));
}

/* ========= Ajout de photos ========= */
async function shrink(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { return null; }
  const draw = async (max, q) => {
    const r = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * r); c.height = Math.round(bmp.height * r); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(ok => c.toBlob(ok, "image/jpeg", q));
  };
  const out = { photo: await draw(1800, .84), thumb: await draw(320, .78) }; bmp.close?.(); return out;
}
$("#file").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  for (let i = 0; i < files.length; i++) {
    const img = await shrink(files[i]);
    if (!img) toast("Cette image n’a pas pu être lue. Tu peux quand même remplir la fiche.");
    const res = await workForm({ imgs: img, fileDate: files[i].lastModified, step: files.length > 1 ? `Photo ${i + 1} sur ${files.length}` : "" });
    if (res === "stop") break;
  }
};
$("#add").onclick = () => {
  const s = openSheet("Ajouter une œuvre", `<div class="list"><label class="btn brass" for="file" id="pick">Choisir ou prendre des photos</label><button class="btn alt" id="nophoto">Noter une œuvre sans photo</button></div>`);
  $("#pick", s).onclick = () => { history.back(); };
  $("#nophoto", s).onclick = () => { history.back(); setTimeout(() => workForm({}), 60); };
};

const lastCtx = () => { const w = [...works].sort((a, b) => b.createdAt - a.createdAt)[0]; return w && Date.now() - w.createdAt < 864e5 * 3 ? w : null; };

function workForm({ imgs, fileDate, step, work }) {
  return new Promise(resolve => {
    const w = work || {}; const url = imgs?.photo ? URL.createObjectURL(imgs.photo) : "";
    const ctx0 = w.ctx || "expo"; const prev = work ? null : lastCtx();
    const date0 = w.date || (fileDate ? new Date(fileDate).toISOString().slice(0, 10) : "");
    const f = (id, label, val = "", extra = "") => `<div class="f"><label for="${id}">${label}</label><input id="${id}" value="${esc(val)}" autocomplete="off" ${extra}></div>`;
    const s = openSheet(work ? "Modifier la fiche" : (step || "Nouvelle œuvre"), `
      ${url ? `<img class="prev" alt="Photo importée" src="${url}">` : ""}
      <p class="hint" style="margin-top:8px">Remplis ce que tu sais : tout est facultatif, tu pourras compléter plus tard.</p>
      <div class="form">
        ${f("w-artist", "Artiste", w.artist, 'list="dl-art"')}
        ${f("w-title", "Titre", w.title)}
        ${f("w-year", "Année de l’œuvre", w.year, 'placeholder="1889, vers 1650, XVIIe siècle…"')}
        <div class="f"><span>Courant artistique</span><div id="w-sug"></div>
          <select id="w-mov" aria-label="Autre courant"><option value="">Aucun pour l’instant</option>${[...MOVEMENTS].sort((a, b) => a.s - b.s).map(m => `<option value="${m.id}">${esc(m.n)}</option>`).join("")}</select></div>
        <div class="two">${f("w-tech", "Technique", w.technique, 'placeholder="Huile sur toile"')}${f("w-dims", "Dimensions", w.dims, 'placeholder="73 × 92 cm"')}</div>
        <div class="f"><span>Où l’as-tu vue ?</span><div class="seg2" id="w-ctx">
          <button type="button" data-c="expo">Exposition</button><button type="button" data-c="livre">Livre</button><button type="button" data-c="lieu">Autre lieu</button></div></div>
        ${prev?.place || prev?.expo ? `<button type="button" class="tag sug" id="w-same">Même visite que la dernière : ${esc(prev.expo || prev.place)}</button>` : ""}
        <div data-for="expo">${f("w-expo", "Nom de l’exposition", w.expo, 'list="dl-expo"')}</div>
        <div data-for="livre">${f("w-book", "Titre du livre", w.book, 'list="dl-book"')}</div>
        <div data-for="livre">${f("w-page", "Page", w.page, 'inputmode="numeric"')}</div>
        <div data-for="expo lieu">${f("w-place", "Musée ou lieu de la photo", w.place, 'list="dl-place"')}</div>
        ${f("w-date", "Date de la visite ou de la lecture", date0, 'type="date"')}
        <div class="f"><span>Ma note</span><div class="stars" id="w-stars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="${n} sur 5">★</button>`).join("")}</div></div>
        <div class="f"><label for="w-notes">Mes impressions</label><textarea id="w-notes">${esc(w.notes)}</textarea></div>
      </div>
      <datalist id="dl-art">${[...new Set([...MOVEMENTS.flatMap(m => m.a).filter(a => !/anonym/i.test(a)), ...works.map(x => x.artist).filter(Boolean)])].sort().map(a => `<option value="${esc(a)}">`).join("")}</datalist>
      <datalist id="dl-expo">${visits.filter(v => v.kind === "expo").map(v => `<option value="${esc(v.name)}">`).join("")}</datalist>
      <datalist id="dl-book">${visits.filter(v => v.kind === "livre").map(v => `<option value="${esc(v.name)}">`).join("")}</datalist>
      <datalist id="dl-place">${[...new Set(works.map(x => x.place).concat(visits.map(v => v.place)).filter(Boolean))].map(a => `<option value="${esc(a)}">`).join("")}</datalist>`,
      `${step ? `<button class="btn alt" id="w-skip">Ignorer cette photo</button>` : ""}<button class="btn" id="w-save">Enregistrer</button>`);
    s.dataset.sticky = "1";
    let ctx = ctx0, rating = w.rating || 0, mov = w.movement || "", done = false;
    const v = id => $("#" + id, s).value.trim();
    const paintCtx = () => { s.querySelectorAll("#w-ctx button").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === ctx)); s.querySelectorAll("[data-for]").forEach(d => d.style.display = d.dataset.for.split(" ").includes(ctx) ? "" : "none"); };
    const paintStars = () => s.querySelectorAll("#w-stars button").forEach(b => b.classList.toggle("on", +b.dataset.n <= rating));
    function paintSug() {

      box.innerHTML = list.length ? `<p class="hint">${y != null ? `Proposé pour ${esc(fmtY(y))}` : "Proposé d’après l’artiste"} :</p><div class="tags" style="margin-bottom:8px">${list.map((m, i) => `<button type="button" class="tag ${i === 0 && mov !== m.id ? "sug" : ""}" data-pick="${m.id}" aria-pressed="${mov === m.id}">${esc(m.n)}</button>`).join("")}</div>` : `<p class="hint">Indique une année ou un artiste pour obtenir une proposition.</p>`;

    paintCtx(); paintStars(); paintSug();

        await dbPut("works", rec);
        const i = works.findIndex(x => x.id === rec.id); if (i >= 0) works[i] = rec; else works.push(rec);
        await linkVisit(rec); resetWorksLayer(); refreshLists();

        finish(rec);

    };
  });
}
async function linkVisit(w) {
  const name = w.ctx === "expo" ? w.expo : w.ctx === "livre" ? w.book : ""; if (!name) return;
  if (visits.some(v => v.kind === w.ctx && norm(v.name) === norm(name))) return;
  const v = { id: uid(), kind: w.ctx, name, place: w.place || "", date: w.date || "", rating: 0, notes: "", createdAt: Date.now() };
  await dbPut("visits", v); visits.push(v);
}

/* ========= Détail d'une œuvre ========= */
async function openWork(id) {
  const w = works.find(x => x.id === id); if (!w) return;
  const ph = w.hasPhoto ? await dbGet("photos", id) : null, url = ph ? URL.createObjectURL(ph.blob) : "", m = byId[w.movement];
  const rows = [["Année", w.year], ["Technique", w.technique], ["Dimensions", w.dims], ["Exposition", w.expo], ["Livre", w.book && (w.book + (w.page ? `, p. ${w.page}` : ""))], ["Lieu", w.place], ["Vue le", w.date && new Date(w.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })], ["Ma note", w.rating ? "★".repeat(w.rating) : ""]].filter(r => r[1]);
  const s = openSheet(w.title || "Sans titre", `${url ? `<img class="full" alt="${esc(w.title || "Œuvre")}" src="${url}">` : ""}
    <p class="dates">${esc(w.artist || "Artiste à préciser")}</p>
    ${rows.length ? `<dl class="meta">${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>` : ""}
    ${m ? `<h3>Courant</h3><div class="tags"><button class="tag" data-m="${m.id}">${esc(m.n)}</button></div>` : ""}
    ${w.notes ? `<h3>Mes impressions</h3><p style="white-space:pre-wrap">${esc(w.notes)}</p>` : ""}
    ${w.artist ? `<h3>En savoir plus</h3><div class="tags"><button class="tag" data-q="${esc(w.artist)}">${esc(w.artist)} sur Wikipédia</button></div>` : ""}`,
    `<button class="btn danger" id="d-del">Supprimer</button><button class="btn" id="d-edit">Modifier</button>`);
  bindCommon(s);
  s.onclosed = () => url && URL.revokeObjectURL(url);
  $("#d-edit", s).onclick = async () => { closeSheet(); setTimeout(async () => { await workForm({ work: w }); }, 60); };
  const del = $("#d-del", s);
  del.onclick = async () => {
    if (!del.classList.contains("arm")) { del.classList.add("arm"); del.textContent = "Confirmer la suppression"; return; }
    await dbDel("works", id); await dbDel("photos", id); works = works.filter(x => x.id !== id); thumbUrls.delete(id);
    closeSheet(); resetWorksLayer(); refreshLists(); toast("Œuvre supprimée");
  };
}
function openGroup(ids) { const list = ids.map(i => works.find(w => w.id === i)).filter(Boolean); const s = openSheet(`${list.length} œuvres`, `<div class="grid">${list.map(tile).join("")}</div>`); bindCommon(s); }

let VIEW = "frise", collFilter = "all";
const TITLES = { oeuvres: "Mes œuvres", carnet: "Mon carnet", recherche: "Recherche" };
function go(v) {
  VIEW = v; document.querySelectorAll(".view").forEach(e => e.classList.toggle("on", e.id === "v-" + v));
  document.querySelectorAll("#nav .t").forEach(b => b.dataset.v === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (v === "frise") { layoutBars(); TL.lastYear = null; schedule(); }
  else { const t = $("#top"); t.classList.add("plain"); t.style.background = "#17493d"; $("#era-btn").textContent = TITLES[v]; delete $("#era-btn").dataset.m; const mc = $('meta[name=theme-color]'); if (mc) mc.content = "#17493d"; }
  refreshLists();
}
function refreshLists() {
  if (VIEW === "oeuvres") renderColl(); if (VIEW === "carnet") renderCarnet();
}
function renderColl() {
  const F = { all: "Toutes", expo: "Expositions", livre: "Livres", lieu: "Autres lieux", todo: "À compléter" };
  const list = [...works].sort((a, b) => b.createdAt - a.createdAt).filter(w => collFilter === "all" || (collFilter === "todo" ? incomplete(w) : w.ctx === collFilter));
  $("#v-oeuvres").innerHTML = `<div class="pad"><div class="filters">${Object.entries(F).map(([k, l]) => `<button data-f="${k}" aria-pressed="${collFilter === k}">${l}</button>`).join("")}</div>
    ${list.length ? `<div class="grid">${list.map(tile).join("")}</div>` : works.length ? `<p class="note">Aucune œuvre dans cette catégorie.</p>` : `<div class="empty"><h2>Ton musée personnel commence ici</h2><p class="note">Appuie sur + pour importer une photo prise en expo ou dans un livre. Elle prendra sa place sur la frise.</p></div>`}</div>`;
}
function renderCarnet() {
  const list = [...visits].sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.createdAt - a.createdAt);
  $("#v-carnet").innerHTML = `<div class="pad"><div class="head-row"><p class="note">${list.length ? `${list.filter(v => v.kind === "expo").length} expositions, ${list.filter(v => v.kind === "livre").length} livres` : ""}</p><button class="btn brass" id="c-add">Ajouter</button></div>
    ${list.length ? `<div class="list">${list.map(v => { const n = works.filter(w => (v.kind === "expo" ? w.expo : w.book) && norm(v.kind === "expo" ? w.expo : w.book) === norm(v.name)).length; return `<button class="card" data-v="${v.id}"><h3>${esc(v.name)}</h3><p>${[v.kind === "expo" ? "Exposition" : "Livre", v.place, v.date && new Date(v.date).toLocaleDateString("fr-FR", { month: "long", year: "numeric" }), n ? `${n} œuvre${n > 1 ? "s" : ""}` : ""].filter(Boolean).map(esc).join(", ")}${v.rating ? " " + "★".repeat(v.rating) : ""}</p>${v.notes ? `<p class="quote">${esc(v.notes.slice(0, 140))}${v.notes.length > 140 ? "…" : ""}</p>` : ""}</button>`; }).join("")}</div>` : `<div class="empty"><h2>Aucune sortie notée</h2><p class="note">Ajoute une exposition ou un livre, avec tes impressions. Ceux que tu cites en ajoutant une photo apparaissent aussi ici.</p></div>`}</div>`;
}
$("#v-oeuvres").onclick = e => { const f = e.target.closest("[data-f]"); if (f) { collFilter = f.dataset.f; renderColl(); return; } const w = e.target.closest("[data-w]"); if (w) openWork(w.dataset.w); };
$("#v-carnet").onclick = e => { if (e.target.closest("#c-add")) return visitForm(); const c = e.target.closest("[data-v]"); if (c) openVisit(c.dataset.v); };

function visitForm(v0) {
  const v = v0 || { kind: "expo" }; let kind = v.kind, rating = v.rating || 0;
  const s = openSheet(v0 ? "Modifier" : "Nouvelle sortie ou lecture", `<div class="form">
    <div class="seg2" id="v-k"><button type="button" data-c="expo">Exposition</button><button type="button" data-c="livre">Livre</button></div>
    <div class="f"><label for="v-name" id="v-nl">Titre</label><input id="v-name" value="${esc(v.name)}" autocomplete="off"></div>
    <div class="f"><label for="v-place" id="v-pl">Musée ou lieu</label><input id="v-place" value="${esc(v.place)}" autocomplete="off"></div>
    <div class="f"><label for="v-date">Date</label><input id="v-date" type="date" value="${esc(v.date)}"></div>
    <div class="f"><span>Ma note</span><div class="stars" id="v-stars">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="${n} sur 5">★</button>`).join("")}</div></div>
    <div class="f"><label for="v-notes">Mes impressions</label><textarea id="v-notes">${esc(v.notes)}</textarea></div></div>`,
    `<button class="btn" id="v-save">Enregistrer</button>`);
  s.dataset.sticky = "1";
  const pk = () => { s.querySelectorAll("#v-k button").forEach(b => b.setAttribute("aria-pressed", b.dataset.c === kind)); $("#v-pl", s).textContent = kind === "expo" ? "Musée ou lieu" : "Auteur"; };
  const ps = () => s.querySelectorAll("#v-stars button").forEach(b => b.classList.toggle("on", +b.dataset.n <= rating));
  $("#v-k", s).onclick = e => { const b = e.target.closest("button"); if (b) { kind = b.dataset.c; pk(); } };
  $("#v-stars", s).onclick = e => { const b = e.target.closest("button"); if (b) { rating = rating === +b.dataset.n ? 0 : +b.dataset.n; ps(); } };
  pk(); ps();
  $("#v-save", s).onclick = async () => {
    const g = id => $("#" + id, s).value.trim();
    const rec = { ...v, id: v.id || uid(), kind, name: g("v-name") || "Sans titre", place: g("v-place"), date: g("v-date"), rating, notes: g("v-notes"), createdAt: v.createdAt || Date.now() };
    await dbPut("visits", rec); const i = visits.findIndex(x => x.id === rec.id); if (i >= 0) visits[i] = rec; else visits.push(rec);
    closeSheet(); refreshLists(); toast("Enregistré");
  };
}
function openVisit(id) {
  const v = visits.find(x => x.id === id); if (!v) return;
  const list = works.filter(w => (v.kind === "expo" ? w.expo : w.book) && norm(v.kind === "expo" ? w.expo : w.book) === norm(v.name));
  const s = openSheet(v.name, `<p class="dates">${[v.kind === "expo" ? "Exposition" : "Livre", v.place, v.date && new Date(v.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })].filter(Boolean).map(esc).join(", ")}${v.rating ? " " + "★".repeat(v.rating) : ""}</p>
    ${v.notes ? `<h3>Mes impressions</h3><p style="white-space:pre-wrap">${esc(v.notes)}</p>` : ""}${list.length ? `<h3>Œuvres</h3><div class="grid">${list.map(tile).join("")}</div>` : ""}`,
    `<button class="btn danger" id="x-del">Supprimer</button><button class="btn" id="x-edit">Modifier</button>`);
  bindCommon(s);
  $("#x-edit", s).onclick = () => { closeSheet(); setTimeout(() => visitForm(v), 60); };
  const del = $("#x-del", s);
  del.onclick = async () => { if (!del.classList.contains("arm")) { del.classList.add("arm"); del.textContent = "Confirmer"; return; } await dbDel("visits", id); visits = visits.filter(x => x.id !== id); closeSheet(); refreshLists(); toast("Supprimé. Les œuvres sont conservées."); };
}

/* Recherche : d'abord dans l'appli, puis sur Wikipédia si le réseau est là */
function localSearch(q) {
  const n = norm(q); if (n.length < 2) return { mov: [], art: [], mine: [] };
  const mov = ALL.filter(m => norm(m.n).includes(n));
  const artMap = new Map(); MOVEMENTS.forEach(m => m.a.forEach(a => { if (norm(a).includes(n) && !/anonym/i.test(a)) { if (!artMap.has(a)) artMap.set(a, []); artMap.get(a).push(m); } }));
  const oeuvres = []; ALL.forEach(m => m.o.forEach(o => { if (norm(o[0]).includes(n)) oeuvres.push({ o, m }); }));
  const mine = works.filter(w => [w.artist, w.title, w.place, w.expo, w.book, w.notes].some(x => norm(x).includes(n)));
  return { mov, art: [...artMap.entries()], oeuvres, mine };
}
async function renderSearch(q = "") {
  const v = $("#v-recherche");
  if (!$("#s-q", v)) {
    v.innerHTML = `<div class="pad"><form class="searchbar" id="s-f"><input id="s-q" type="search" placeholder="Artiste, courant, œuvre…" aria-label="Rechercher" autocomplete="off"><button class="btn brass">Chercher</button></form><div id="s-r"></div></div>`;
    $("#s-f", v).onsubmit = e => { e.preventDefault(); $("#s-q", v).blur(); renderSearch($("#s-q", v).value.trim()); };
    $("#s-q", v).oninput = e => renderLocal(e.target.value.trim());
    $("#s-r", v).onclick = async e => {
      const t = e.target.closest("[data-m],[data-w],[data-t],[data-saved]"); if (!t) return;
      if (t.dataset.m) openFiche(t.dataset.m); else if (t.dataset.w) openWork(t.dataset.w);
      else if (t.dataset.saved) showWiki(await dbGet("wiki", t.dataset.saved));
      else { try { showWiki(await fetchSummary(t.dataset.t)); renderSavedOnly(); } catch { toast("Wikipédia n’a pas répondu. Réessaie dans un instant."); } }
    };
  }
  renderLocal(q);
  if (!q) return;
  const box = document.createElement("div"); box.id = "s-web";
  $("#s-r", v).append(box);
  if (!navigator.onLine) { box.innerHTML = `<h3 class="sec-t">Wikipédia</h3><p class="note">Pas de réseau. Les fiches de l’appli et les pages déjà consultées restent disponibles.</p>`; return; }
  box.innerHTML = `<h3 class="sec-t">Wikipédia</h3><p class="note">Recherche en cours…</p>`;
  try {
    const hits = await wikiSearch(q);
    box.innerHTML = `<h3 class="sec-t">Wikipédia</h3>` + (hits.length ? `<div class="list">${hits.map(h => `<button class="card" data-t="${esc(h.title)}"><h3>${esc(h.title)}</h3><p>${esc(h.snip)}</p></button>`).join("")}</div>` : `<p class="note">Aucune page trouvée.</p>`);
  } catch { box.innerHTML = `<h3 class="sec-t">Wikipédia</h3><p class="note">Wikipédia n’a pas répondu. Réessaie dans un instant.</p>`; }
}
function renderSavedOnly() { const q = $("#s-q")?.value.trim(); if (!q) renderLocal(""); }
async function renderLocal(q) {
  const r = $("#s-r"); const { mov, art, oeuvres, mine } = localSearch(q);
  if (!q || norm(q).length < 2) {
    const saved = (await dbAll("wiki")).sort((a, b) => b.at - a.at);
    r.innerHTML = saved.length ? `<h3 class="sec-t" style="margin-top:4px">Pages enregistrées</h3><p class="note" style="margin-bottom:8px">Consultables sans réseau.</p><div class="list">${saved.map(d => `<button class="card" data-saved="${esc(d.id)}"><h3>${esc(d.title)}</h3><p>${esc((d.desc || d.text).slice(0, 110))}</p></button>`).join("")}</div>` : `<div class="empty"><h2>Cherche un artiste, un courant, une œuvre</h2><p class="note">Les fiches de l’appli répondent même hors ligne. Avec du réseau, Wikipédia complète, et chaque page lue reste disponible ensuite.</p></div>`;
    return;
  }
  let h = "";
  if (mov.length) h += `<h3 class="sec-t" style="margin-top:4px">Courants et époques</h3><div class="list">${mov.map(m => `<button class="card" data-m="${m.id}"><h3>${esc(m.n)}</h3><p>${fmtSpan(m)}</p></button>`).join("")}</div>`;
  if (art.length) h += `<h3 class="sec-t">Artistes</h3><div class="list">${art.slice(0, 12).map(([a, ms]) => `<button class="card" data-m="${ms[0].id}"><h3>${esc(a)}</h3><p>${ms.map(m => esc(m.n)).join(", ")}</p></button>`).join("")}</div>`;
  if (oeuvres.length) h += `<h3 class="sec-t">Œuvres célèbres</h3><div class="list">${oeuvres.slice(0, 12).map(({ o, m }) => `<button class="card" data-m="${m.id}"><h3>${esc(o[0])}</h3><p>${esc(o[1])}, ${esc(o[2])}. ${esc(m.n)}</p></button>`).join("")}</div>`;
  if (mine.length) h += `<h3 class="sec-t">Mes œuvres</h3><div class="grid">${mine.map(tile).join("")}</div>`;
  r.innerHTML = h || `<p class="note">Rien dans l’appli. Appuie sur Chercher pour interroger Wikipédia.</p>`;
}

/* ========= Sauvegarde et réglages ========= */
const b64 = blob => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(blob); });
const unb64 = async s => (await fetch(s)).blob();
async function exportAll() {
  toast("Préparation de la sauvegarde…");
  const parts = ['{"app":"cimaise","v":1,"visits":', JSON.stringify(visits), ',"notes":', JSON.stringify(await dbAll("notes")), ',"wiki":', JSON.stringify(await dbAll("wiki")), ',"works":['];
  let first = true; for (const w of works) { parts.push((first ? "" : ",") + JSON.stringify({ ...w, thumb: w.thumb ? await b64(w.thumb) : null })); first = false; }
  parts.push('],"photos":['); first = true;
  for (const w of works) { if (!w.hasPhoto) continue; const p = await dbGet("photos", w.id); if (!p) continue; parts.push((first ? "" : ",") + JSON.stringify({ id: w.id, b: await b64(p.blob) })); first = false; }
  parts.push("]}");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(parts, { type: "application/json" }));
  a.download = `cimaise-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000); lsSet("lastBackup", Date.now());
  toast("Sauvegarde téléchargée");
}
async function importAll(file) {
  try {
    const d = JSON.parse(await file.text()); if (d.app !== "cimaise") throw 0;
    for (const v of d.visits || []) await dbPut("visits", v);
    for (const n of d.notes || []) await dbPut("notes", n);
    for (const x of d.wiki || []) await dbPut("wiki", x);
    for (const w of d.works || []) await dbPut("works", { ...w, thumb: w.thumb ? await unb64(w.thumb) : null });
    for (const p of d.photos || []) await dbPut("photos", { id: p.id, blob: await unb64(p.b) });
    works = await dbAll("works"); visits = await dbAll("visits"); thumbUrls.clear(); resetWorksLayer(); refreshLists();
    toast(`${(d.works || []).length} œuvres restaurées`);
  } catch { toast("Ce fichier n’est pas une sauvegarde Cimaise valide."); }
}
async function openSettings() {
  let used = ""; try { const e = await navigator.storage.estimate(); used = `${Math.round(e.usage / 1048576)} Mo utilisés sur ${Math.round(e.quota / 1048576).toLocaleString("fr-FR")} Mo disponibles`; } catch {}
  let persisted = false; try { persisted = await navigator.storage.persisted(); if (!persisted) persisted = await navigator.storage.persist(); } catch {}
  const last = lsGet("lastBackup", 0);
  const s = openSheet("Mes données", `<p class="lead">${works.length} œuvres et ${visits.length} sorties, enregistrées uniquement sur cet appareil.</p>
    <p class="small">${used}. ${persisted ? "Stockage protégé contre le nettoyage automatique." : "Installe l’appli sur l’écran d’accueil pour protéger le stockage."}</p>
    <h3>Sauvegarde</h3><p>Si tu désinstalles l’appli ou changes de téléphone, seule une sauvegarde permet de tout retrouver. Dernière sauvegarde : ${last ? new Date(last).toLocaleDateString("fr-FR") : "aucune"}.</p>
    <div class="list" style="margin-top:10px"><button class="btn" id="s-exp">Télécharger une sauvegarde</button><label class="btn alt" for="s-imp">Restaurer une sauvegarde</label><input id="s-imp" type="file" accept="application/json,.json" hidden></div>
    <h3>Connexion</h3><p class="small">L’appli fonctionne sans réseau. Seules la recherche et la synthèse Wikipédia ont besoin d’internet. Elle n’utilise jamais Claude.</p>`);
  $("#s-exp", s).onclick = exportAll;
  $("#s-imp", s).onchange = e => { if (e.target.files[0]) importAll(e.target.files[0]); };
}

/* ========= Démarrage ========= */
async function start() {
  try { await openDb(); works = await dbAll("works"); visits = await dbAll("visits"); }
  catch { toast("Le stockage de ce navigateur est indisponible : rien ne sera conservé."); }
  document.querySelectorAll("#cols .seg button").forEach(b => { b.setAttribute("aria-pressed", b.dataset.t === TL.track); b.onclick = () => setTrack(b.dataset.t); });
  const mid = () => readY();
  $("#z-in").onclick = () => zoomAt(mid(), TL.z * 1.6);
  $("#z-out").onclick = () => zoomAt(mid(), TL.z / 1.6);
  $("#z-all").onclick = () => { TL.z = minZ(); TL.top = 0; clampTop(); schedule(); };
  $("#chips").onclick = e => { const b = e.target.closest("[data-m]"); if (b) openFiche(b.dataset.m); };
  $("#era-btn").onclick = e => { if (e.currentTarget.dataset.m) openFiche(e.currentTarget.dataset.m); };
  $("#menu").onclick = openSettings;
  document.querySelectorAll("#nav .t").forEach(b => b.onclick = () => { go(b.dataset.v); if (b.dataset.v === "recherche") renderSearch($("#s-q")?.value.trim() || ""); });
  $("#v-frise").classList.add("on"); buildTimeline(); go("frise");
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
  try { navigator.storage?.persist?.(); } catch {}
}
start();
</script>
